name: CI

# Run on every push and pull request targeting main.
# This ensures tests pass before anything is merged.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'       # Eclipse Temurin — free, LTS, widely used

      # Cache the Gradle wrapper binary and downloaded dependencies.
      # The cache key includes the OS and a hash of all Gradle build files,
      # so it is invalidated automatically whenever dependencies change.
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Run tests first — fail fast before attempting a full build.
      - name: Run unit tests
        run: ./gradlew test

      # Build the JAR, skipping tests (already ran above) to avoid double execution.
      - name: Build JAR
        run: ./gradlew build -x test

      # Always upload test reports so failures are visible in the Actions UI,
      # even when the test step itself fails.
      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: build/reports/tests/test/
