# ─── Application ──────────────────────────────────────────────────────────────
spring.application.name=openpad-backend

# ─── Server ───────────────────────────────────────────────────────────────────
server.port=8081

# ─── Database ──────────────────────────────────────────────────────────────────
# Default: H2 (in-memory, no external DB needed)
spring.datasource.url=jdbc:h2:mem:openpad
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (useful for debugging) — access at http://localhost:8081/h2-console
spring.h2.console.enabled=true

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ──────────────────────────────────────────────────────────────────────────────
# To switch databases, uncomment ONE of the sections below and add the driver
# dependency in build.gradle.kts (search for "runtimeOnly" comments there)
# ──────────────────────────────────────────────────────────────────────────────

